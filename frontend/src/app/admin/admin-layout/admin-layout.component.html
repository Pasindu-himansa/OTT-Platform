<div class="admin-wrapper">
  <div
    class="overlay"
    [class.show]="sidebarOpen"
    (click)="closeSidebar()"
  ></div>

  <!-- Admin Sidebar -->
  <nav class="admin-sidebar" [class.open]="sidebarOpen">
    <div class="sidebar-brand">
      <i class="fa-solid fa-shield-halved"></i>
      <span>Admin Panel</span>
    </div>

    <div class="sidebar-nav">
      <div class="sidebar-section-title">Overview</div>
      @for (item of navItems; track item.path) {
        <a
          class="sidebar-link"
          [routerLink]="item.path"
          routerLinkActive="active"
          (click)="closeSidebar()"
        >
          <i class="fa-solid" [class]="'fa-solid ' + item.icon"></i>
          {{ item.label }}
        </a>
      }

      <div class="sidebar-section-title" style="margin-top: 16px">System</div>
      <div class="sidebar-link" (click)="exitAdmin()">
        <i class="fa-solid fa-arrow-left"></i> Back to App
      </div>
      <div class="sidebar-link danger" (click)="logout()">
        <i class="fa-solid fa-right-from-bracket"></i> Logout
      </div>
    </div>

    <div class="sidebar-user">
      <div
        class="avatar"
        style="background: linear-gradient(135deg, #5856d6, #ff2d55)"
      >
        {{ authService.currentUser?.name?.charAt(0) }}
      </div>
      <div class="info">
        <div class="name">{{ authService.currentUser?.name }}</div>
        <div class="plan" style="color: var(--accent2)">Administrator</div>
      </div>
    </div>
  </nav>

  <!-- Main content -->
  <div class="admin-content">
    <!-- Topbar -->
    <div class="topbar">
      <div class="topbar-left">
        <button class="menu-toggle" (click)="toggleSidebar()">
          <i class="fa-solid fa-bars"></i>
        </button>
        <div class="topbar-search">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" placeholder="Search admin..." />
        </div>
      </div>
      <div class="topbar-right">
        <button class="topbar-btn">
          <i class="fa-solid fa-bell"></i>
          <span class="notif-dot"></span>
        </button>
        <button class="topbar-btn" (click)="exitAdmin()">
          <i class="fa-solid fa-arrow-left"></i>
        </button>
      </div>
    </div>

    <!-- Page content -->
    <div class="admin-body">
      <router-outlet />
    </div>
  </div>
</div>
