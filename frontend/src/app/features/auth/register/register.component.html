<div class="auth-page">
  <div class="auth-card fade-up">
    <a class="auth-back" routerLink="/auth/login">
      <i class="fa-solid fa-arrow-left"></i> Back to Login
    </a>
    <h2>Create Account</h2>
    <p class="subtitle">Start your streaming journey</p>

    @if (error) {
      <div class="error-msg">
        <i class="fa-solid fa-circle-exclamation"></i> {{ error }}
      </div>
    }

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Full Name</label>
        <input
          type="text"
          [(ngModel)]="name"
          name="name"
          placeholder="John Doe"
        />
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="you@example.com"
        />
      </div>
      <div class="form-group" style="position: relative">
        <label>Password</label>
        <input
          [type]="showPass ? 'text' : 'password'"
          [(ngModel)]="password"
          name="password"
          placeholder="Create a strong password"
          style="padding-right: 48px"
        />
        <button type="button" class="eye-btn" (click)="showPass = !showPass">
          <i
            class="fa-solid"
            [class]="showPass ? 'fa-eye-slash' : 'fa-eye'"
          ></i>
        </button>
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input
          type="password"
          [(ngModel)]="confirmPw"
          name="confirmPw"
          placeholder="Confirm your password"
        />
      </div>
      <button
        type="submit"
        class="btn btn-primary btn-full btn-lg"
        [disabled]="loading"
      >
        {{ loading ? "Creating account..." : "Create Account" }}
      </button>
    </form>

    <p class="auth-footer" style="margin-top: 24px">
      Already have an account?
      <a routerLink="/auth/login" style="color: var(--accent)">Sign In</a>
    </p>
  </div>
</div>
