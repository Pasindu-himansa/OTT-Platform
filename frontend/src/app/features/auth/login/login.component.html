<div class="auth-page">
  <div class="auth-card fade-up">
    <a class="auth-back" routerLink="/auth/onboarding">
      <i class="fa-solid fa-arrow-left"></i> Back
    </a>
    <h2>Welcome Back</h2>
    <p class="subtitle">Sign in to continue watching</p>

    @if (error) {
      <div class="error-msg">
        <i class="fa-solid fa-circle-exclamation"></i> {{ error }}
      </div>
    }

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Email Address</label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="you@example.com"
        />
      </div>
      <div class="form-group" style="position: relative">
        <label>Password</label>
        <input
          [type]="showPass ? 'text' : 'password'"
          [(ngModel)]="password"
          name="password"
          placeholder="Enter your password"
          style="padding-right: 48px"
        />
        <button type="button" class="eye-btn" (click)="showPass = !showPass">
          <i
            class="fa-solid"
            [class]="showPass ? 'fa-eye-slash' : 'fa-eye'"
          ></i>
        </button>
      </div>
      <div class="form-row">
        <label
          ><input type="checkbox" style="accent-color: var(--accent)" />
          Remember me</label
        >
        <a routerLink="/auth/forgot-password" style="color: var(--accent)"
          >Forgot Password?</a
        >
      </div>
      <button
        type="submit"
        class="btn btn-primary btn-full btn-lg"
        [disabled]="loading"
      >
        {{ loading ? "Signing in..." : "Sign In" }}
      </button>
    </form>

    <div class="form-divider">or continue with</div>

    <div class="social-btns">
      <button class="social-btn">
        <i class="fa-brands fa-google"></i> Google
      </button>
      <button class="social-btn">
        <i class="fa-brands fa-apple"></i> Apple
      </button>
    </div>

    <p class="auth-footer">
      Don't have an account?
      <a routerLink="/auth/register" style="color: var(--accent)">Sign Up</a>
    </p>
    <p class="auth-footer" style="margin-top: 12px">
      <a routerLink="/admin" style="color: var(--accent2)"
        ><i class="fa-solid fa-shield-halved"></i> Admin Portal</a
      >
    </p>
  </div>
</div>
