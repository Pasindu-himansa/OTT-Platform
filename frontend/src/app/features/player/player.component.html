<div
  class="player-wrapper"
  (mousemove)="showControlsTemporarily()"
  (click)="showControlsTemporarily()"
  [class.hide-cursor]="!showControls && isPlaying"
>
  <video #videoEl class="video-el" (click)="togglePlay()" playsinline></video>

  <!-- Top bar -->
  <div class="player-topbar" [class.visible]="showControls">
    <button class="ctrl-btn" (click)="goBack()">
      <i class="fa-solid fa-arrow-left"></i>
    </button>
    <div class="player-title">
      <h3>
        {{ title }}
        @if (isLive) {
          <span
            style="
              background: #ff453a;
              color: #fff;
              font-size: 11px;
              padding: 2px 8px;
              border-radius: 4px;
              margin-left: 8px;
              font-weight: 700;
              letter-spacing: 1px;
            "
          >
            ● LIVE
          </span>
        }
      </h3>
      <p>{{ subtitle }}</p>
    </div>
    <div class="topbar-actions">
      <button class="ctrl-btn"><i class="fa-solid fa-cast"></i></button>
      <button class="ctrl-btn">
        <i class="fa-solid fa-ellipsis-vertical"></i>
      </button>
    </div>
  </div>

  <!-- Center play button -->
  @if (!isPlaying) {
    <div class="center-play" (click)="togglePlay()">
      <i class="fa-solid fa-play"></i>
    </div>
  }

  <!-- Bottom controls -->
  <div class="player-controls" [class.visible]="showControls">
    <div class="progress-wrap">
      <div class="progress-track">
        <div class="progress-buffered" [style.width.%]="buffered"></div>
        <div class="progress-played" [style.width.%]="progressPercent"></div>
        <div class="progress-thumb" [style.left.%]="progressPercent"></div>
      </div>
      <input
        type="range"
        class="progress-input"
        min="0"
        [max]="duration"
        [value]="currentTime"
        step="0.1"
        (input)="seek($event)"
      />
    </div>

    <div class="controls-row">
      <div class="controls-left">
        <button class="ctrl-btn large" (click)="togglePlay()">
          <i
            class="fa-solid"
            [class]="isPlaying ? 'fa-solid fa-pause' : 'fa-solid fa-play'"
          ></i>
        </button>
        <button class="ctrl-btn" (click)="seekBy(-10)">
          <i class="fa-solid fa-rotate-left"></i>
          <span class="seek-label">10</span>
        </button>
        <button class="ctrl-btn" (click)="seekBy(10)">
          <i class="fa-solid fa-rotate-right"></i>
          <span class="seek-label">10</span>
        </button>
        <div class="volume-wrap">
          <button class="ctrl-btn" (click)="toggleMute()">
            <i
              class="fa-solid"
              [class]="
                isMuted || volume === 0
                  ? 'fa-solid fa-volume-xmark'
                  : volume < 0.5
                    ? 'fa-solid fa-volume-low'
                    : 'fa-solid fa-volume-high'
              "
            >
            </i>
          </button>
          <input
            type="range"
            class="volume-slider"
            min="0"
            max="1"
            step="0.05"
            [value]="isMuted ? 0 : volume"
            (input)="setVolume($event)"
          />
        </div>
        <span class="time-display">
          {{ formatTime(currentTime) }} / {{ formatTime(duration) }}
        </span>
      </div>

      <div class="controls-right">
        @if (qualityLevels.length > 0) {
          <select
            class="quality-select"
            (change)="setQuality(+$any($event.target).value)"
          >
            <option value="-1">Auto</option>
            @for (level of qualityLevels; track $index) {
              <option [value]="$index">{{ level.height }}p</option>
            }
          </select>
        }
        <button class="ctrl-btn">
          <i class="fa-solid fa-closed-captioning"></i>
        </button>
        <button class="ctrl-btn"><i class="fa-solid fa-gear"></i></button>
        <button class="ctrl-btn large" (click)="toggleFullscreen()">
          <i
            class="fa-solid"
            [class]="
              isFullscreen ? 'fa-solid fa-compress' : 'fa-solid fa-expand'
            "
          ></i>
        </button>
      </div>
    </div>
  </div>
</div>
