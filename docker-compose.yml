services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ott_api
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - ott_net

  postgres:
    image: postgres:16-alpine
    container_name: ott_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ott_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ott_pass}
      POSTGRES_DB: ${POSTGRES_DB:-ott_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ott_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ott_net

  mongo:
    image: mongo:7
    container_name: ott_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-ott_user}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-ott_pass}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-ott_db}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo/init.js:/docker-entrypoint-initdb.d/init.js
    healthcheck:
      test: ["CMD", "mongosh", "--eval", 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ott_net

  redis:
    image: redis:7-alpine
    container_name: ott_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-ott_redis_pass}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "--pass",
          "${REDIS_PASSWORD:-ott_redis_pass}",
          "ping",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ott_net

  nginx:
    image: nginx:alpine
    container_name: ott_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist/frontend/browser/browser:/var/www/html
      - ./backend/uploads:/var/www/uploads:ro
    depends_on:
      - api
    networks:
      - ott_net

  mongo-express:
    image: mongo-express:latest
    container_name: ott_mongo_express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER:-ott_user}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD:-ott_pass}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER:-ott_user}:${MONGO_PASSWORD:-ott_pass}@mongo:27017/
      ME_CONFIG_BASICAUTH: false
    depends_on:
      - mongo
    networks:
      - ott_net
    profiles:
      - dev

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ott_pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ott.local
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - postgres
    networks:
      - ott_net
    profiles:
      - dev

volumes:
  postgres_data:
  mongo_data:
  redis_data:

networks:
  ott_net:
    driver: bridge
